
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Charlas Con Gepetto</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
main{max-width:1200px;margin:32px auto;padding:0 20px}
.head{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}
h1{font-size:clamp(24px,3vw,34px);margin:0 0 6px}
p{margin:0;color:var(--muted)}
.card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #10182808}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.controls label{font-weight:600;font-size:13px}
.controls select,.controls button{font:inherit;border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink)}
#chart{width:100%;min-height:360px;position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis path,.axis line{stroke:#d0d5dd}
.axis text{fill:#667085;font-size:11px}
.grid line{stroke:#edf0f3}
.grid path{display:none}
.layer{cursor:pointer;opacity:.92;transition:opacity .12s}
.layer:hover{opacity:1;stroke:#fff;stroke-width:1.5}
.crosshair{stroke:#344054;stroke-width:1;stroke-dasharray:2 4;opacity:.55;pointer-events:none}
.focus-dot{fill:#202733;stroke:white;stroke-width:2;pointer-events:none}
.tooltip{position:absolute;pointer-events:none;background:#17212f;color:white;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 8px 24px #0002;max-width:250px;opacity:0;visibility:hidden;z-index:10}
.tooltip strong{display:block;font-size:13px;margin-bottom:5px}
.tiprow{display:flex;justify-content:space-between;gap:16px;margin-top:3px}
.tiprow span:first-child{color:#d0d5dd}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:#475467;user-select:none}
.swatch{width:11px;height:11px;border-radius:3px}
.legend-item.off{opacity:.35;text-decoration:line-through}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.status{font-size:13px;color:#b42318;padding:8px 0}
@media(max-width:650px){main{margin:18px auto;padding:0 12px}.card{padding:12px}#chart{min-height:280px}}
</style>
</head>
<body>
<main>
<div class="head">
<div>
  <h1>¿De qué van mis charlas con la IA?</h1>
  <p>
    Mis charlas con Gepetto 
    <svg xmlns="http://w3.org" width="18" height="18" fill="#10a37f" viewBox="0 0 24 24" style="vertical-align: -0.2em; display: inline-block; margin-left: 2px;">
      <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>
    </svg>
    mes a mes y por área temática
  </p>
</div>

</div>

<section class="card">
<div class="controls">

  <label for="mode">Medida</label>
  <select id="mode">
    <option value="absolute">Cantidad de conversaciones</option>
    <option value="share">Participación mensual (%)</option>
  </select>

  <label for="start">Desde</label>
  <select id="start"></select>

  <label for="end">Hasta</label>
  <select id="end"></select>

  <label for="areaFilter">Filtro de áreas</label>
  <select id="areaFilter">
    <option value="all">Todas las áreas</option>
    <option value="5">Top 5</option>
    <option value="10">Top 10</option>
    <option value="manual">Selección manual</option>
  </select>

  <button id="showAll" type="button">Todas</button>
  <button id="showNone" type="button">Ninguna</button>
  <button id="invert" type="button">Invertir</button>

  <button id="reset" type="button">Restablecer áreas</button>

</div>

<div id="status" class="status"></div>
<div id="chart"><div id="tooltip" class="tooltip"></div></div>
<div id="legend" class="legend"></div>
<div class="note">
  Pasá el cursor sobre una banda para identificar el área,
  el mes, la cantidad de conversaciones, su participación
  mensual y su ranking. La leyenda permite seleccionar
  las áreas visibles.
</div>
</section>
</main>

<script>
const CSV_URL='../../data/processed/conversations_master.csv';
const parseDate=d3.timeParse('%Y-%m');
const monthNames=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const meses = [
  'ene','feb','mar','abr','may','jun',
  'jul','ago','sep','oct','nov','dic'
];

function fmtMonth(date){
  return `${meses[date.getMonth()]} ${date.getFullYear()}`;
}
const fmtInt=d3.format(',');
const fmtPct=d3.format('.1%');

const status=document.querySelector('#status');
const tip=document.querySelector('#tooltip');
let allRows=[],allAreas=[],hidden=new Set(),months=[];
const palette=d3.schemeTableau10.concat(d3.schemeSet3);
const color=d3.scaleOrdinal(palette);

function parseCSV(text){
 return d3.csvParse(text,d=>({...d,date:d.period?parseDate(d.period):null}))
   .filter(d=>d.date&&d.area);
}

d3.csv(CSV_URL).then(raw=>{
 allRows=parseCSV(d3.csvFormat(raw));
 allAreas=[...new Set(allRows.map(d=>d.area))]
   .sort((a,b)=>a.localeCompare(b,'es'));
 
 color.domain(allAreas);

 months=[...new Set(allRows.map(d=>d.period))].sort();
 if(!months.length) throw new Error('No se encontró la columna period con formato YYYY-MM.');

 const start=document.querySelector('#start');
 const end=document.querySelector('#end');
 months.forEach(m=>{
   start.add(new Option(fmtMonth(parseDate(m)),m));
   end.add(new Option(fmtMonth(parseDate(m)),m));
 });

start.value=months[0];
end.value=months.at(-1);

 document.querySelectorAll('.controls select')
   .forEach(el=>el.addEventListener('change',draw));

 document.querySelector('#reset').addEventListener('click',()=>{
   hidden.clear();
   draw();
 });
 draw();
}).catch(err=>{
 status.textContent='No pude cargar el CSV: '+err.message+
   '. Revisá la ruta CSV_URL y serví el proyecto por HTTP.';
 console.error(err);
});

function draw(){
 status.textContent='';
 const s=document.querySelector('#start').value;
 const e=document.querySelector('#end').value;
 let selectedMonths=months.filter(m=>m>=s&&m<=e);

 if(!selectedMonths.length){
   status.textContent='El período seleccionado no contiene meses.';
   return;
 }

document.querySelector('#showAll').onclick=()=>{
  hidden.clear();
  document.querySelector('#areaFilter').value='all';
  draw();
};

document.querySelector('#showNone').onclick=()=>{
  allAreas.forEach(a=>hidden.add(a));
  document.querySelector('#areaFilter').value='manual';
  draw();
};

document.querySelector('#invert').onclick=()=>{
  const previous = new Set(hidden);

  hidden.clear();

  allAreas.forEach(a=>{
    if(!previous.has(a)) hidden.add(a);
  });

  document.querySelector('#areaFilter').value='manual';
  draw();
};

document.querySelector('#areaFilter').onchange=()=>{
  hidden.clear();
  draw();
};

 const filter = document.querySelector('#areaFilter').value;

// Calcular frecuencia de cada área dentro del período
const frequency = new Map(
  allAreas.map(a => [
    a,
    allRows.filter(r =>
      r.period >= s && r.period <= e && r.area === a
    ).length
  ])
);

// Ordenar de mayor a menor frecuencia
const rankedAreas = [...allAreas].sort((a,b) =>
  frequency.get(b) - frequency.get(a)
);

let visible;

if(filter === 'all'){
  visible = allAreas.filter(a => !hidden.has(a));

}else if(filter === '5' || filter === '10'){
  visible = rankedAreas
    .slice(0, Number(filter))
    .filter(a => !hidden.has(a));

}else{
  visible = allAreas.filter(a => !hidden.has(a));
}

if(!visible.length){
  status.textContent='Mostrá al menos un área.';
  return;
}

 const totals=d3.rollup(allRows,v=>v.length,d=>d.period);
 const counts=d3.rollup(allRows,v=>v.length,d=>d.period,d=>d.area);

 const rows=selectedMonths.map(m=>{
   let o={month:m,date:parseDate(m),total:totals.get(m)||0};
   visible.forEach(a=>o[a]=counts.get(m)?.get(a)||0);
   return o;
 });

 const mode=document.querySelector('#mode').value;
 if(mode==='share')
   rows.forEach(r=>visible.forEach(a=>r[a]=r.total?r[a]/r.total:0));

 const series=d3.stack()
   .keys(visible)
   .offset(mode==='share'?d3.stackOffsetExpand:d3.stackOffsetSilhouette)(rows);

 const chart=document.querySelector('#chart');
 chart.querySelector('svg')?.remove();

 const W=Math.max(320,chart.clientWidth);
 const H=430;
 const margin={top:18,right:22,bottom:54,left:48};
 const w=W-margin.left-margin.right;
 const h=H-margin.top-margin.bottom;

 const svg=d3.select(chart).append('svg')
   .attr('viewBox',`0 0 ${W} ${H}`)
   .attr('role','img')
   .attr('aria-label','Streamgraph mensual por área');

 const g=svg.append('g')
   .attr('transform',`translate(${margin.left},${margin.top})`);

 const x=d3.scalePoint()
   .domain(selectedMonths)
   .range([0,w])
   .padding(.5);

 const ymin=d3.min(series,s=>d3.min(s,d=>d[0]));
 const ymax=d3.max(series,s=>d3.max(s,d=>d[1]));
 const y=d3.scaleLinear()
   .domain([ymin,ymax])
   .nice()
   .range([h,0]);

 const area=d3.area()
   .x(d=>x(d.data.month))
   .y0(d=>y(d[0]))
   .y1(d=>y(d[1]))
   .curve(d3.curveBasis);

   // Eje Y y grilla
if(mode==='share'){

   // Grilla horizontal sin etiquetas
   g.append('g')
     .attr('class','grid')
     .call(
       d3.axisLeft(y)
         .tickValues([0,.2,.4,.6,.8,1])
         .tickSize(-w)
         .tickFormat('')
     );

   // Único eje Y visible: porcentajes
   g.append('g')
     .attr('class','axis')
     .call(
       d3.axisLeft(y)
         .tickValues([0,.2,.4,.6,.8,1])
         .tickFormat(fmtPct)
     );

}else{

   // En cantidad absoluta no mostramos valores Y,
   // porque el streamgraph está centrado en cero.
   g.append('g')
     .attr('class','grid')
     .call(
       d3.axisLeft(y)
         .ticks(5)
         .tickSize(-w)
         .tickFormat('')
     );
}

 g.selectAll('.layer')
   .data(series)
   .join('path')
   .attr('class','layer')
   .attr('fill',d=>color(d.key))
   .attr('d',area)
   .on('click',(ev,d)=>{
     hidden.has(d.key)?hidden.delete(d.key):hidden.add(d.key);
     draw();
   });

 const tickMonths=selectedMonths.length>18
   ?selectedMonths.filter((m,i)=>
       i%Math.ceil(selectedMonths.length/12)===0||
       i===selectedMonths.length-1)
   :selectedMonths;

 g.append('g')
   .attr('class','axis')
   .attr('transform',`translate(0,${h})`)
   .call(d3.axisBottom(x)
     .tickValues(tickMonths)
     .tickFormat(m=>fmtMonth(parseDate(m))))
   .selectAll('text')
  .attr('text-anchor','middle')
  .attr('transform',null)
  .attr('dx',0)
  .attr('dy','.8em');

 const guide=g.append('line')
   .attr('class','crosshair')
   .attr('y1',0)
   .attr('y2',h)
   .style('display','none');

 const dot=g.append('circle')
   .attr('class','focus-dot')
   .attr('r',4)
   .style('display','none');

 const overlay=g.append('rect')
  .attr('width',w)
  .attr('height',h)
  .attr('fill','transparent')
  .style('cursor','crosshair');

overlay
  .on('mousemove',function(ev){

    const [mx,my] = d3.pointer(ev,this);

    // Buscar el mes más cercano
    let best = selectedMonths.reduce((a,b)=>
      Math.abs(x(b)-mx)<Math.abs(x(a)-mx)?b:a
    );

    // Obtener la posición del mes dentro de los datos
    const i = selectedMonths.indexOf(best);

    // Buscar la categoría que ocupa esa posición vertical
    let detectedArea = null;

    for(const layer of series){

      const d = layer[i];

      const yTop = y(d[1]);
      const yBottom = y(d[0]);

      if(my >= Math.min(yTop,yBottom) &&
         my <= Math.max(yTop,yBottom)){

        detectedArea = layer.key;
        break;
      }
    }

    if(detectedArea){
      showMonth(best,detectedArea);
    }else{
      tip.style.opacity='0';
      tip.style.visibility='hidden';
    }

    guide.attr('x1',x(best)).attr('x2',x(best))
      .style('display',null).raise();

    dot.attr('cx',x(best)).attr('cy',my)
      .style('display',null).raise();
  })
  .on('mouseleave',()=>{
    guide.style('display','none');
    dot.style('display','none');
    tip.style.opacity='0';
    tip.style.visibility='hidden';
  });

function showMonth(m, detectedArea){
   const px=x(m);

   guide.attr('x1',px).attr('x2',px)
     .style('display',null).raise();

   dot.attr('cx',px).attr('cy',h)
     .style('display',null).raise();

   const total = totals.get(m) || 0;
   const area = detectedArea;
   const n = counts.get(m)?.get(area) || 0;

   // Ranking mensual: considera todas las categorías,
   // incluso las ocultas en la leyenda.
   const rank = 1 + allAreas.filter(a =>
     (counts.get(m)?.get(a) || 0) > n
   ).length;

   const share = total ? n / total : 0;

   let html = `
     <strong>${fmtMonth(parseDate(m))}</strong>
     <div class="tiprow">
       <span>Categoría</span>
       <b>${area}</b>
     </div>
     <div class="tiprow">
       <span>Conversaciones</span>
       <b>${fmtInt(n)}</b>
     </div>
     <div class="tiprow">
       <span>Participación mensual</span>
       <b>${fmtPct(share)}</b>
     </div>
     <div class="tiprow">
       <span>Ranking mensual</span>
       <b>${rank}.º de ${allAreas.length}</b>
     </div>
   `;

tip.innerHTML = html;
   tip.style.opacity='1';
   tip.style.visibility='visible';

   const left=Math.min(chart.clientWidth-tip.offsetWidth-8,
     Math.max(8,margin.left+px+12));

   tip.style.left=left+'px';
   tip.style.top='24px';
 }

 const leg=document.querySelector('#legend');
leg.innerHTML='';

  allAreas.forEach(a=>{
    const item=document.createElement('div');

    item.className='legend-item'+
      (hidden.has(a)?' off':'');

    item.innerHTML=`
      <span class="swatch"
        style="background:${color(a)}"></span>
      <span>${a}</span>
    `;

    item.onclick=()=>{
      if(hidden.has(a)){
        hidden.delete(a);
      }else{
        hidden.add(a);
      }

      // Pasar a selección manual al modificar la leyenda
      document.querySelector('#areaFilter').value='manual';

      draw();
    };

    leg.append(item);
  });
  }
</script>
</body>
</html>
