
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las conversaciones de una vida digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 24px;
      background: #10141C;
      color: #F1F5F9;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .subtitle {
      color: #94A3B8;
      font-size: 16px;
      line-height: 1.6;
    }

    .chart-container {
      background: #10141C;
      border-radius: 12px;
      overflow: hidden;
      padding: 12px 0;
    }

    footer {
      margin-top: 28px;
      color: #64748B;
      font-size: 12px;
      text-align: right;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Las conversaciones de una vida digital</h1>
      <p class="subtitle">
        Cómo evolucionan mis intereses y consultas a lo largo del tiempo
        · Noviembre 2024 – Noviembre 2026
      </p>
    </header>

    <section class="chart-container">
      <div class="flourish-embed flourish-chart"
           data-src="visualisation/30869242">
        <script src="https://public.flourish.studio/resources/embed.js"></script>
        <noscript>
          <img
            src="https://public.flourish.studio/visualisation/30869242/thumbnail"
            width="100%"
            alt="Evolución mensual de las conversaciones por temática">
        </noscript>
      </div>
    </section>

    <footer>
      Visualización interactiva · Made with Flourish
    </footer>
  </main>
</body>
</html>
